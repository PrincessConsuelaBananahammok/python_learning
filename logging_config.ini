[loggers]
keys=root,sampleLogger, customLoger, testSearchLogger

[handlers]
keys=consoleHandler,fileHandler, errorFileHandler, testSearchHandler

[formatters]
keys=sampleFormatter, infoFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_customLoger]
level=ERROR
handlers=errorFileHandler
qualname=customLoger
propagate=0

[logger_sampleLogger]
level=DEBUG
handlers=fileHandler, errorFileHandler
qualname=sampleLogger
propagate=0

[logger_testSearchLogger]
level=DEBUG
handlers=consoleHandler,testSearchHandler
qualname=testSearchLogger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=infoFormatter
args=('example.log',)

[handler_testSearchHandler]
class=FileHandler
level=DEBUG
formatter=infoFormatter
args=('test_search.log',)

[handler_errorFileHandler]
class=FileHandler
level=ERROR
formatter=sampleFormatter
args=('error.log',)

[formatter_sampleFormatter]
format=%(asctime)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_infoFormatter]
format=%(asctime)s - %(levelname)s - row %(lineno)d - %(message)s
datefmt=%Y/%m/%d
